<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Combate Chung vs Hung</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        body {
            background: linear-gradient(135deg, #1a2a6c, #b21f1f, #1a2a6c);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            color: white;
        }
        
        .container {
            width: 100%;
            max-width: 900px;
            background-color: rgba(0, 0, 0, 0.8);
            border-radius: 20px;
            box-shadow: 0 15px 30px rgba(0, 0, 0, 0.5);
            overflow: hidden;
        }
        
        /* Pantalla de Login */
        .login-screen {
            padding: 40px;
            text-align: center;
        }
        
        .logo {
            font-size: 48px;
            margin-bottom: 20px;
            color: #ffcc00;
        }
        
        .app-title {
            font-size: 32px;
            margin-bottom: 30px;
            color: #fff;
            text-transform: uppercase;
            letter-spacing: 2px;
        }
        
        .login-form {
            display: flex;
            flex-direction: column;
            gap: 20px;
            max-width: 400px;
            margin: 0 auto;
        }
        
        .input-group {
            position: relative;
        }
        
        .input-group i {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: #999;
        }
        
        input {
            width: 100%;
            padding: 15px 15px 15px 50px;
            border: none;
            border-radius: 50px;
            font-size: 16px;
            background-color: rgba(255, 255, 255, 0.9);
            transition: all 0.3s;
        }
        
        input:focus {
            outline: none;
            box-shadow: 0 0 10px rgba(255, 204, 0, 0.8);
        }
        
        .btn {
            padding: 15px;
            border: none;
            border-radius: 50px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        
        .btn-login {
            background: linear-gradient(to right, #ffcc00, #ff6600);
            color: #000;
        }
        
        .btn-login:hover {
            transform: translateY(-3px);
            box-shadow: 0 5px 15px rgba(255, 102, 0, 0.4);
        }
        
        /* Pantalla de Combate */
        .fight-screen {
            display: none;
            height: 100%;
            flex-direction: column;
        }
        
        .header {
            background-color: rgba(0, 0, 0, 0.9);
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
        }
        
        .user-info {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 10px;
        }
        
        .user-info img {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            object-fit: cover;
        }
        
        .timer-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin: 10px 0;
        }
        
        .round-info {
            font-size: 18px;
            margin-bottom: 5px;
            color: #ffcc00;
        }
        
        .timer {
            font-size: 48px;
            font-weight: bold;
            font-family: 'Courier New', monospace;
            color: #ffcc00;
            background-color: rgba(0, 0, 0, 0.7);
            padding: 10px 30px;
            border-radius: 10px;
            border: 2px solid #ff6600;
        }
        
        .timer-controls {
            display: flex;
            gap: 10px;
            margin-top: 10px;
        }
        
        .btn-control {
            padding: 8px 15px;
            border: none;
            border-radius: 5px;
            font-size: 14px;
            cursor: pointer;
        }
        
        .btn-start {
            background-color: #4CAF50;
            color: white;
        }
        
        .btn-pause {
            background-color: #f44336;
            color: white;
        }
        
        .btn-reset {
            background-color: #2196F3;
            color: white;
        }
        
        .btn-settings {
            background-color: #9C27B0;
            color: white;
        }
        
        .competitors {
            display: flex;
            flex: 1;
        }
        
        .competitor {
            flex: 1;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
            transition: all 0.3s;
        }
        
        .competitor.highlight {
            box-shadow: inset 0 0 30px rgba(255, 255, 255, 0.5);
        }
        
        .competitor.hung {
            background: linear-gradient(to bottom, #b21f1f, #8b0000);
        }
        
        .competitor.chung {
            background: linear-gradient(to bottom, #1a2a6c, #00008b);
        }
        
        .competitor-name {
            font-size: 32px;
            font-weight: bold;
            margin-bottom: 15px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);
        }
        
        .points-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin: 20px 0;
            background-color: rgba(0, 0, 0, 0.3);
            padding: 20px;
            border-radius: 15px;
            width: 100%;
        }
        
        .points-label {
            font-size: 18px;
            margin-bottom: 10px;
            color: #ffcc00;
        }
        
        .points {
            font-size: 64px;
            font-weight: bold;
            font-family: 'Courier New', monospace;
        }
        
        .fouls-container {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }
        
        .foul {
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background-color: rgba(255, 255, 255, 0.3);
            border: 1px solid #ccc;
        }
        
        .foul.active {
            background-color: #ffcc00;
        }
        
        .buttons-container {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            width: 100%;
            margin-top: auto;
        }
        
        .btn-point {
            padding: 15px;
            border: none;
            border-radius: 10px;
            font-size: 20px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s;
            background-color: rgba(255, 255, 255, 0.9);
        }
        
        .btn-point:hover {
            transform: scale(1.05);
        }
        
        .btn-point.plus {
            background-color: #4CAF50;
            color: white;
        }
        
        .btn-point.minus {
            background-color: #f44336;
            color: white;
        }
        
        .footer {
            background-color: rgba(0, 0, 0, 0.9);
            padding: 15px;
            text-align: center;
            display: flex;
            justify-content: center;
            gap: 20px;
            flex-wrap: wrap;
        }
        
        .btn-footer {
            padding: 10px 20px;
            border: none;
            border-radius: 30px;
            font-size: 16px;
            cursor: pointer;
            background: linear-gradient(to right, #ffcc00, #ff6600);
            color: #000;
            font-weight: bold;
        }
        
        /* Modal */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.8);
            z-index: 100;
            justify-content: center;
            align-items: center;
        }
        
        .modal-content {
            background: linear-gradient(135deg, #1a2a6c, #000);
            border-radius: 15px;
            padding: 30px;
            width: 90%;
            max-width: 500px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            border: 2px solid #ffcc00;
        }
        
        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            border-bottom: 1px solid #ffcc00;
            padding-bottom: 10px;
        }
        
        .modal-title {
            font-size: 24px;
            color: #ffcc00;
        }
        
        .close-modal {
            background: none;
            border: none;
            color: white;
            font-size: 24px;
            cursor: pointer;
        }
        
        .time-settings {
            display: flex;
            gap: 15px;
            margin-bottom: 20px;
        }
        
        .time-group {
            flex: 1;
        }
        
        .settings-label {
            display: block;
            margin-bottom: 8px;
            color: #ffcc00;
        }
        
        .settings-input {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            border: none;
            background-color: rgba(255, 255, 255, 0.9);
            font-size: 16px;
        }
        
        .settings-input.time-input {
            padding: 12px;
            text-align: center;
        }
        
        .device-list {
            margin-top: 20px;
            max-height: 200px;
            overflow-y: auto;
        }
        
        .device-item {
            padding: 10px;
            background-color: rgba(255, 255, 255, 0.1);
            border-radius: 5px;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
        }
        
        .device-item i {
            margin-right: 10px;
            color: #ffcc00;
        }
        
        /* Responsive */
        @media (max-width: 768px) {
            .competitors {
                flex-direction: column;
            }
            
            .timer {
                font-size: 36px;
            }
            
            .points {
                font-size: 48px;
            }
            
            .header {
                flex-direction: column;
                align-items: center;
            }
        }
        
        @media (max-width: 480px) {
            .login-screen {
                padding: 20px;
            }
            
            .app-title {
                font-size: 24px;
            }
            
            .competitor-name {
                font-size: 24px;
            }
            
            .points {
                font-size: 36px;
            }
            
            .btn-point {
                padding: 10px;
                font-size: 16px;
            }
            
            .timer {
                font-size: 24px;
                padding: 5px 15px;
            }
            
            .footer {
                flex-direction: column;
                gap: 10px;
            }
            
            .btn-footer {
                width: 100%;
            }
        }
        
        /* Animaciones */
        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }
        
        .pulse {
            animation: pulse 1s infinite;
        }
        
        .winner {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.8);
            display: none;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            z-index: 10;
        }
        
        .winner-text {
            font-size: 48px;
            font-weight: bold;
            color: #ffcc00;
            text-align: center;
            margin-bottom: 20px;
            text-transform: uppercase;
        }
        
        .winner-name {
            font-size: 64px;
            color: #4CAF50;
            text-shadow: 0 0 20px rgba(76, 175, 80, 0.8);
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Pantalla de Login -->
        <div class="login-screen" id="loginScreen">
            <div class="logo">
                <i class="fas fa-fist-raised"></i>
            </div>
            <h1 class="app-title">Sistema de Combate</h1>
            <form class="login-form" id="loginForm">
                <div class="input-group">
                    <i class="fas fa-user"></i>
                    <input type="text" id="username" placeholder="Usuario" required>
                </div>
                <div class="input-group">
                    <i class="fas fa-lock"></i>
                    <input type="password" id="password" placeholder="Contraseña" required>
                </div>
                <button type="submit" class="btn btn-login">Iniciar Sesión</button>
            </form>
        </div>
        
        <!-- Pantalla de Combate -->
        <div class="fight-screen" id="fightScreen">
            <div class="header">
                <div class="user-info">
                    <img src="https://ui-avatars.com/api/?name=Usuario" alt="Usuario">
                    <span id="userDisplay">Usuario</span>
                </div>
                <div class="timer-container">
                    <div class="round-info">Round <span id="currentRound">1</span>/<span id="totalRounds">2</span></div>
                    <div class="timer" id="timer">02:00</div>
                    <div class="timer-controls">
                        <button class="btn-control btn-start" id="startTimer"><i class="fas fa-play"></i></button>
                        <button class="btn-control btn-pause" id="pauseTimer"><i class="fas fa-pause"></i></button>
                        <button class="btn-control btn-reset" id="resetTimer"><i class="fas fa-redo"></i></button>
                        <button class="btn-control btn-settings" id="openSettings"><i class="fas fa-cog"></i></button>
                    </div>
                </div>
            </div>
            
            <div class="competitors">
                <!-- Competidor Hung (rojo) -->
                <div class="competitor hung" id="hungCompetitor">
                    <div class="winner" id="hungWinner">
                        <div class="winner-text">¡Vencedor!</div>
                        <div class="winner-name">HUNG</div>
                    </div>
                    <h2 class="competitor-name">HUNG</h2>
                    
                    <div class="points-container">
                        <div class="points-label">Puntos</div>
                        <div class="points" id="hungPoints">0</div>
                    </div>
                    
                    <div class="fouls-container">
                        <div class="foul" id="hungFoul1"></div>
                        <div class="foul" id="hungFoul2"></div>
                        <div class="foul" id="hungFoul3"></div>
                    </div>
                    
                    <div class="buttons-container">
                        <button class="btn-point plus" data-competitor="hung" data-points="1">+1</button>
                        <button class="btn-point plus" data-competitor="hung" data-points="2">+2</button>
                        <button class="btn-point plus" data-competitor="hung" data-points="3">+3</button>
                        <button class="btn-point minus" data-competitor="hung" data-points="-1">Falta -1</button>
                        <button class="btn-point minus" data-competitor="hung" data-points="-0.5">Falta -0.5</button>
                    </div>
                </div>
                
                <!-- Competidor Chung (azul) -->
                <div class="competitor chung" id="chungCompetitor">
                    <div class="winner" id="chungWinner">
                        <div class="winner-text">¡Vencedor!</div>
                        <div class="winner-name">CHUNG</div>
                    </div>
                    <h2 class="competitor-name">CHUNG</h2>
                    
                    <div class="points-container">
                        <div class="points-label">Puntos</div>
                        <div class="points" id="chungPoints">0</div>
                    </div>
                    
                    <div class="fouls-container">
                        <div class="foul" id="chungFoul1"></div>
                        <div class="foul" id="chungFoul2"></div>
                        <div class="foul" id="chungFoul3"></div>
                    </div>
                    
                    <div class="buttons-container">
                        <button class="btn-point plus" data-competitor="chung" data-points="1">+1</button>
                        <button class="btn-point plus" data-competitor="chung" data-points="2">+2</button>
                        <button class="btn-point plus" data-competitor="chung" data-points="3">+3</button>
                        <button class="btn-point minus" data-competitor="chung" data-points="-1">Falta -1</button>
                        <button class="btn-point minus" data-competitor="chung" data-points="-0.5">Falta -0.5</button>
                    </div>
                </div>
            </div>
            
            <div class="footer">
                <button class="btn-footer" id="resetFight"><i class="fas fa-sync"></i> Reiniciar Combate</button>
                <button class="btn-footer" id="connectDevice"><i class="fas fa-link"></i> Conectar Dispositivo</button>
            </div>
        </div>
    </div>
    
    <!-- Modal de Configuración -->
    <div class="modal" id="settingsModal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 class="modal-title">Configuración</h2>
                <button class="close-modal" id="closeSettings">&times;</button>
            </div>
            
            <div class="time-settings">
                <div class="time-group">
                    <label class="settings-label">Minutos por Round</label>
                    <input type="number" class="settings-input time-input" id="roundMinutes" min="0" max="10" value="2">
                </div>
                <div class="time-group">
                    <label class="settings-label">Segundos por Round</label>
                    <input type="number" class="settings-input time-input" id="roundSeconds" min="0" max="59" value="0">
                </div>
            </div>
            
            <div class="settings-group">
                <label class="settings-label">Número de Rounds</label>
                <input type="number" class="settings-input" id="totalRoundsInput" min="1" max="5" value="2">
            </div>
            
            <div class="settings-group">
                <label class="settings-label">Dispositivos Conectados</label>
                <div class="device-list" id="deviceList">
                    <div class="device-item">
                        <i class="fas fa-desktop"></i> Este dispositivo (Principal)
                    </div>
                    <div class="device-item">
                        <i class="fas fa-mobile-alt"></i> Móvil de Juan (Conectado)
                    </div>
                    <div class="device-item">
                        <i class="fas fa-tablet-alt"></i> Tablet de María (Conectado)
                    </div>
                </div>
            </div>
            
            <button class="btn btn-login" id="saveSettings">Guardar Cambios</button>
        </div>
    </div>

    <script>
        // Variables de estado
        let isTimerRunning = false;
        let timerInterval;
        let timeLeft = 120; // 2 minutos en segundos
        let currentRound = 1;
        let totalRounds = 2;
        
        // Puntuaciones
        let hungPoints = 0;
        let hungFouls = 0;
        let chungPoints = 0;
        let chungFouls = 0;
        
        // Elementos DOM
        const loginScreen = document.getElementById('loginScreen');
        const fightScreen = document.getElementById('fightScreen');
        const loginForm = document.getElementById('loginForm');
        const userDisplay = document.getElementById('userDisplay');
        const timerElement = document.getElementById('timer');
        const currentRoundElement = document.getElementById('currentRound');
        const totalRoundsElement = document.getElementById('totalRounds');
        const startTimerBtn = document.getElementById('startTimer');
        const pauseTimerBtn = document.getElementById('pauseTimer');
        const resetTimerBtn = document.getElementById('resetTimer');
        const openSettingsBtn = document.getElementById('openSettings');
        const closeSettingsBtn = document.getElementById('closeSettings');
        const saveSettingsBtn = document.getElementById('saveSettings');
        const settingsModal = document.getElementById('settingsModal');
        const roundMinutesInput = document.getElementById('roundMinutes');
        const roundSecondsInput = document.getElementById('roundSeconds');
        const totalRoundsInput = document.getElementById('totalRoundsInput');
        const resetFightBtn = document.getElementById('resetFight');
        const connectDeviceBtn = document.getElementById('connectDevice');
        const hungPointsElement = document.getElementById('hungPoints');
        const chungPointsElement = document.getElementById('chungPoints');
        const hungFoulElements = [
            document.getElementById('hungFoul1'),
            document.getElementById('hungFoul2'),
            document.getElementById('hungFoul3')
        ];
        const chungFoulElements = [
            document.getElementById('chungFoul1'),
            document.getElementById('chungFoul2'),
            document.getElementById('chungFoul3')
        ];
        const hungWinner = document.getElementById('hungWinner');
        const chungWinner = document.getElementById('chungWinner');
        const hungCompetitor = document.getElementById('hungCompetitor');
        const chungCompetitor = document.getElementById('chungCompetitor');
        
        // Inicializar la aplicación
        function initApp() {
            updateTimerDisplay();
            updateFoulsDisplay();
            
            // Event Listeners
            loginForm.addEventListener('submit', handleLogin);
            startTimerBtn.addEventListener('click', startTimer);
            pauseTimerBtn.addEventListener('click', pauseTimer);
            resetTimerBtn.addEventListener('click', resetTimer);
            openSettingsBtn.addEventListener('click', openSettings);
            closeSettingsBtn.addEventListener('click', closeSettings);
            saveSettingsBtn.addEventListener('click', saveSettings);
            resetFightBtn.addEventListener('click', resetFight);
            connectDeviceBtn.addEventListener('click', connectDevice);
            
            // Event delegation para botones de puntos
            document.querySelectorAll('.btn-point').forEach(button => {
                button.addEventListener('click', handlePointsButton);
            });
        }
        
        // Manejar inicio de sesión
        function handleLogin(e) {
            e.preventDefault();
            const username = document.getElementById('username').value;
            userDisplay.textContent = username;
            loginScreen.style.display = 'none';
            fightScreen.style.display = 'flex';
        }
        
        // Actualizar display del temporizador
        function updateTimerDisplay() {
            const minutes = Math.floor(timeLeft / 60);
            const seconds = timeLeft % 60;
            timerElement.textContent = `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
            
            // Cambiar color cuando quedan 30 segundos o menos
            if (timeLeft <= 30) {
                timerElement.classList.add('pulse');
            } else {
                timerElement.classList.remove('pulse');
            }
        }
        
        // Iniciar temporizador
        function startTimer() {
            if (isTimerRunning || timeLeft <= 0) return;
            
            isTimerRunning = true;
            timerInterval = setInterval(() => {
                timeLeft--;
                updateTimerDisplay();
                
                if (timeLeft <= 0) {
                    pauseTimer();
                    handleRoundEnd();
                }
            }, 1000);
        }
        
        // Pausar temporizador
        function pauseTimer() {
            clearInterval(timerInterval);
            isTimerRunning = false;
        }
        
        // Reiniciar temporizador
        function resetTimer() {
            pauseTimer();
            const minutes = parseInt(roundMinutesInput.value) || 0;
            const seconds = parseInt(roundSecondsInput.value) || 0;
            timeLeft = minutes * 60 + seconds;
            updateTimerDisplay();
        }
        
        // Manejar final de round
        function handleRoundEnd() {
            // Avanzar al siguiente round
            currentRound++;
            
            if (currentRound <= totalRounds) {
                currentRoundElement.textContent = currentRound;
                resetTimer();
                alert(`¡Round ${currentRound - 1} completado! Preparados para el siguiente round.`);
            } else {
                alert('¡Combate completado!');
                // Aquí se podría agregar lógica para determinar el ganador final
            }
        }
        
        // Abrir configuración
        function openSettings() {
            pauseTimer();
            settingsModal.style.display = 'flex';
        }
        
        // Cerrar configuración
        function closeSettings() {
            settingsModal.style.display = 'none';
        }
        
        // Guardar configuración
        function saveSettings() {
            const minutes = parseInt(roundMinutesInput.value) || 0;
            const seconds = parseInt(roundSecondsInput.value) || 0;
            totalRounds = parseInt(totalRoundsInput.value);
            timeLeft = minutes * 60 + seconds;
            
            // Validar que el tiempo sea válido
            if (timeLeft <= 0) {
                alert("El tiempo por round debe ser mayor a cero");
                timeLeft = 120; // Valor por defecto
                roundMinutesInput.value = 2;
                roundSecondsInput.value = 0;
            }
            
            totalRoundsElement.textContent = totalRounds;
            updateTimerDisplay();
            closeSettings();
        }
        
        // Reiniciar combate
        function resetFight() {
            pauseTimer();
            
            // Reiniciar puntos y faltas
            hungPoints = 0;
            hungFouls = 0;
            chungPoints = 0;
            chungFouls = 0;
            
            // Reiniciar rondas
            currentRound = 1;
            currentRoundElement.textContent = currentRound;
            
            // Reiniciar timer
            resetTimer();
            
            // Actualizar displays
            hungPointsElement.textContent = hungPoints;
            chungPointsElement.textContent = chungPoints;
            updateFoulsDisplay();
            
            // Ocultar mensajes de ganador
            hungWinner.style.display = 'none';
            chungWinner.style.display = 'none';
            
            // Habilitar botones
            document.querySelectorAll('.btn-point').forEach(btn => {
                btn.disabled = false;
            });
        }
        
        // Conectar dispositivo (simulado)
        function connectDevice() {
            const deviceName = prompt("Ingrese el nombre del dispositivo:");
            if (deviceName) {
                const deviceList = document.getElementById('deviceList');
                const newDevice = document.createElement('div');
                newDevice.className = 'device-item';
                newDevice.innerHTML = `<i class="fas fa-mobile-alt"></i> ${deviceName} (Conectado)`;
                deviceList.appendChild(newDevice);
                
                alert(`Dispositivo "${deviceName}" conectado con éxito!`);
            }
        }
        
        // Manejar botones de puntos
        function handlePointsButton(e) {
            const competitor = e.target.dataset.competitor;
            const points = parseFloat(e.target.dataset.points);
            
            if (competitor === 'hung') {
                if (points < 0) {
                    hungFouls += Math.abs(points);
                    hungPoints += points; // Restar puntos
                } else {
                    hungPoints += points;
                }
                hungPointsElement.textContent = hungPoints.toFixed(1);
            } else {
                if (points < 0) {
                    chungFouls += Math.abs(points);
                    chungPoints += points; // Restar puntos
                } else {
                    chungPoints += points;
                }
                chungPointsElement.textContent = chungPoints.toFixed(1);
            }
            
            updateFoulsDisplay();
            checkForLoser();
        }
        
        // Actualizar display de faltas
        function updateFoulsDisplay() {
            // Hung
            hungFoulElements.forEach((foul, index) => {
                if (hungFouls > index) {
                    foul.classList.add('active');
                } else {
                    foul.classList.remove('active');
                }
            });
            
            // Chung
            chungFoulElements.forEach((foul, index) => {
                if (chungFouls > index) {
                    foul.classList.add('active');
                } else {
                    foul.classList.remove('active');
                }
            });
        }
        
        // Comprobar si hay un perdedor por faltas
        function checkForLoser() {
            if (hungFouls >= 3) {
                chungWinner.style.display = 'flex';
                disableAllButtons();
            }
            
            if (chungFouls >= 3) {
                hungWinner.style.display = 'flex';
                disableAllButtons();
            }
        }
        
        // Deshabilitar todos los botones
        function disableAllButtons() {
            document.querySelectorAll('.btn-point').forEach(btn => {
                btn.disabled = true;
            });
        }
        
        // Inicializar la aplicación cuando se carga la página
        window.addEventListener('DOMContentLoaded', initApp);
    </script>
</body>
</html>
