        function generarFrases() {
            const frases = [];
            const combinacionesUnicas = new Set();
            
            while(frases.length < 1000) {
                const inicio = generadores.inicios[Math.floor(Math.random() * generadores.inicios.length)];
                const accion = generadores.acciones[Math.floor(Math.random() * generadores.acciones.length)];
                const final = generadores.finales[Math.floor(Math.random() * generadores.finales.length)];
                const autor = generadores.autores[Math.floor(Math.random() * generadores.autores.length)];
                
                const fraseCompleta = `${inicio} ${accion} ${final}`;
                const comboUnico = `${inicio}|${accion}|${final}`;
                
                if(!combinacionesUnicas.has(comboUnico)) {
                    combinacionesUnicas.add(comboUnico);
                    frases.push({
                        texto: fraseCompleta,
                        autor: autor
                    });
                }
            }
            return frases;
        }

        const frasesMotivacionales = generarFrases();

        function leerTexto(texto) {
            if ('speechSynthesis' in window) {
                const synthesis = window.speechSynthesis;
                synthesis.cancel();
                const utterance = new SpeechSynthesisUtterance(texto);
                utterance.lang = 'es-ES';
                utterance.rate = 1.1;
                
                const voices = synthesis.getVoices();
                const spanishVoice = voices.find(voice => voice.lang === 'es-ES');
                if(spanishVoice) utterance.voice = spanishVoice;
                
                synthesis.speak(utterance);
                
                setTimeout(mostrarFraseAleatoria, 20000);
                setBackground()
            }
        }
        function setBackground() {
        const apiKey = 'YmQtmc465hPFEBzyavFK9GQA4eIQq6iQrSR1Ne4iDEebZc1EfQtFTn18';
        const imageUrl = `https://api.pexels.com/v1/curated?per_page=1&page=${Math.floor(Math.random() * 1000)}`;
        const videoUrl = `https://api.pexels.com/videos/popular?per_page=1&page=${Math.floor(Math.random() * 1000)}`;

        const isVideo = Math.random() < 0.5; // Decidir aleatoriamente entre imagen o video

        fetch(isVideo ? videoUrl : imageUrl, {
            headers: {
                Authorization: apiKey
            }
        })
        .then(response => response.json())
        .then(data => {
            if (isVideo) {
                const videoSrc = data.videos[0].video_files.find(file => file.quality === 'sd').link;
                const videoElement = document.createElement('video');
                videoElement.src = videoSrc;
                videoElement.autoplay = true;
                videoElement.loop = true;
                videoElement.muted = true;
                gameScreen.appendChild(videoElement);
            } else {
                const imageUrl = data.photos[0].src.large;
                document.body.style.backgroundImage = `url('${imageUrl}')`;
            }
        })
        .catch(error => {
            console.error('Error al obtener el fondo del nivel:', error);
            // Si hay un error, se puede establecer un fondo predeterminado
            document.body.style.backgroundImage = `url('ruta/a/imagen-predeterminada.jpg')`;
        });
    }
        function mostrarFraseAleatoria() {

            const indiceAleatorio = Math.floor(Math.random() * frasesMotivacionales.length);
            const fraseSeleccionada = frasesMotivacionales[indiceAleatorio];
            
            fraseContainer.innerHTML = `
                <blockquote>
                    "${fraseSeleccionada.texto}"
                    <span class="autor">- ${fraseSeleccionada.autor}</span>
                </blockquote>
            `;
            
            leerTexto(fraseSeleccionada.texto);
        }
