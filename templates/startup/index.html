<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Coming Soon</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --deep-bg: #0c0714;
      --purple-deep: #1a0a2e;
      --purple-mid: #3b1d6e;
      --purple-vivid: #7c3aed;
      --purple-soft: #8b5cf6;
      --gold: #c9a84c;
      --gold-light: #d4af37;
      --gold-pale: #e8d48b;
      --wine: #3d1a2e;
      --cream: #f5efe0;
      --mauve: #6d5a8a;
    }

    body {
      min-height: 100vh;
      background: var(--deep-bg);
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      overflow: hidden;
      perspective: 1200px;
    }

    /* ── Curtains ──────────────────────────────────────────────── */
    .curtain-container {
      position: fixed;
      inset: 0;
      z-index: 1000;
      display: flex;
      pointer-events: none;
    }

    .curtain-panel {
      flex: 1;
      height: 100%;
      position: relative;
      transition: transform 1.8s cubic-bezier(0.77, 0, 0.18, 1);
      overflow: hidden;
    }

    .curtain-panel--left { transform-origin: left center; }
    .curtain-panel--right { transform-origin: right center; }

    .curtain-panel.open-left { transform: translateX(-100%); }
    .curtain-panel.open-right { transform: translateX(100%); }

    .curtain-panel::before {
      content: '';
      position: absolute;
      inset: 0;
      background:
        repeating-linear-gradient(
          90deg,
          rgba(60, 20, 50, 0.6) 0px,
          rgba(120, 40, 80, 0.5) 4px,
          rgba(180, 60, 100, 0.3) 8px,
          rgba(120, 40, 80, 0.5) 12px,
          rgba(60, 20, 50, 0.6) 16px
        ),
        linear-gradient(
          180deg,
          #1c0a14 0%,
          #2d1020 15%,
          #4a1a30 30%,
          #3d1428 50%,
          #2a0e1c 70%,
          #160810 100%
        );
      background-size: 16px 100%, 100% 100%;
    }

    .curtain-panel::after {
      content: '';
      position: absolute;
      inset: 0;
      background:
        radial-gradient(ellipse at 30% 50%, rgba(200, 168, 76, 0.08) 0%, transparent 60%),
        radial-gradient(ellipse at 70% 50%, rgba(200, 168, 76, 0.05) 0%, transparent 60%);
      mix-blend-mode: overlay;
    }

    /* Curtain folds (vertical lines) */
    .curtain-fold {
      position: absolute;
      top: 0;
      bottom: 0;
      width: 1px;
      background: rgba(0, 0, 0, 0.3);
      z-index: 2;
    }

    .curtain-fold:nth-child(1) { left: 10%; }
    .curtain-fold:nth-child(2) { left: 25%; }
    .curtain-fold:nth-child(3) { left: 40%; }
    .curtain-fold:nth-child(4) { left: 55%; }
    .curtain-fold:nth-child(5) { left: 70%; }
    .curtain-fold:nth-child(6) { left: 85%; }

    /* Curtain drape (top scalloped edge) */
    .curtain-drape {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 40px;
      z-index: 3;
      background:
        radial-gradient(ellipse at 12.5% 100%, rgba(60, 20, 50, 0.9) 0%, transparent 70%),
        radial-gradient(ellipse at 37.5% 100%, rgba(60, 20, 50, 0.9) 0%, transparent 70%),
        radial-gradient(ellipse at 62.5% 100%, rgba(60, 20, 50, 0.9) 0%, transparent 70%),
        radial-gradient(ellipse at 87.5% 100%, rgba(60, 20, 50, 0.9) 0%, transparent 70%);
    }

    /* Gold curtain rod */
    .curtain-rod {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      height: 6px;
      z-index: 1001;
      background: linear-gradient(90deg,
        var(--gold) 0%,
        var(--gold-light) 20%,
        var(--gold-pale) 40%,
        var(--gold-light) 60%,
        var(--gold) 80%,
        #a08030 100%
      );
      box-shadow:
        0 2px 12px rgba(201, 168, 76, 0.3),
        0 4px 30px rgba(201, 168, 76, 0.15);
    }

    .curtain-rod::before {
      content: '';
      position: absolute;
      top: 6px;
      left: 0;
      right: 0;
      height: 4px;
      background: linear-gradient(90deg,
        transparent 0%,
        rgba(201, 168, 76, 0.08) 20%,
        rgba(201, 168, 76, 0.12) 50%,
        rgba(201, 168, 76, 0.08) 80%,
        transparent 100%
      );
    }

    /* Curtain tie / rope */
    .curtain-tie {
      position: absolute;
      bottom: 30%;
      width: 40px;
      height: 40px;
      z-index: 4;
      border-radius: 50%;
      background: radial-gradient(circle at 40% 40%, var(--gold-light), var(--gold), #8a7020);
      box-shadow:
        0 4px 20px rgba(201, 168, 76, 0.4),
        inset 0 -2px 6px rgba(0,0,0,0.3);
    }

    .curtain-panel--left .curtain-tie { right: -20px; }
    .curtain-panel--right .curtain-tie { left: -20px; }

    .curtain-tie::after {
      content: '';
      position: absolute;
      top: 20px;
      left: -20px;
      width: 80px;
      height: 6px;
      background: linear-gradient(90deg,
        transparent,
        var(--gold-light) 20%,
        var(--gold) 50%,
        var(--gold-light) 80%,
        transparent
      );
      border-radius: 3px;
      filter: blur(1px);
      opacity: 0.6;
    }

    /* ── End Curtains ────────────────────────────────────────── */

    /* Canvas de partículas */
    #particles-canvas {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
    }

    /* Film grain overlay */
    body::after {
      content: '';
      position: fixed;
      inset: 0;
      z-index: 1;
      pointer-events: none;
      opacity: 0.025;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='1'/%3E%3C/svg%3E");
      background-repeat: repeat;
      background-size: 256px 256px;
      animation: grain 0.15s steps(6) infinite;
    }

    @keyframes grain {
      0%, 100% { transform: translate(0, 0); }
      10% { transform: translate(-2px, -1px); }
      20% { transform: translate(3px, 2px); }
      30% { transform: translate(-1px, 3px); }
      40% { transform: translate(2px, -2px); }
      50% { transform: translate(-3px, 1px); }
      60% { transform: translate(1px, -3px); }
      70% { transform: translate(-2px, 1px); }
      80% { transform: translate(3px, -2px); }
      90% { transform: translate(-1px, 2px); }
    }

    /* Cinematic letterbox */
    .cinematic-overlay {
      position: fixed;
      inset: 0;
      z-index: 2;
      pointer-events: none;
      box-shadow:
        inset 0 0 200px rgba(0,0,0,0.8),
        inset 0 0 80px rgba(0,0,0,0.5),
        0 0 80px rgba(201, 168, 76, 0.03);
    }

    /* Main card */
    .hero-card {
      position: relative;
      z-index: 10;
      transform-style: preserve-3d;
      transition: transform 0.1s ease-out;
      will-change: transform;
    }

    .glass-card {
      background: rgba(255, 255, 255, 0.03);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1px solid rgba(255, 255, 255, 0.06);
      border-radius: 32px;
      padding: 4rem 3.5rem;
      box-shadow:
        0 30px 80px rgba(0, 0, 0, 0.6),
        0 0 0 1px rgba(255, 255, 255, 0.02) inset,
        0 0 60px rgba(139, 92, 246, 0.06),
        0 0 120px rgba(201, 168, 76, 0.03);
      transform: translateZ(40px);
    }

    .glass-card > * {
      transform: translateZ(30px);
    }

    /* Coming soon label */
    .coming-label {
      display: inline-block;
      font-size: 0.75rem;
      letter-spacing: 6px;
      text-transform: uppercase;
      color: var(--gold-pale);
      border: 1px solid rgba(201, 168, 76, 0.2);
      padding: 0.4rem 1.6rem;
      border-radius: 100px;
      margin-bottom: 1.5rem;
      background: rgba(201, 168, 76, 0.04);
      text-shadow: 0 0 20px rgba(201, 168, 76, 0.15);
    }

    /* Divider ornament */
    .ornament {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 1rem;
      margin: 1.8rem auto;
      opacity: 0.4;
    }

    .ornament-line {
      width: 50px;
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--gold), transparent);
    }

    .ornament-diamond {
      width: 6px;
      height: 6px;
      background: var(--gold);
      transform: rotate(45deg);
      box-shadow: 0 0 10px rgba(201, 168, 76, 0.3);
    }

    /* Main title */
    .hero-title {
      font-size: clamp(2.8rem, 10vw, 6rem);
      font-weight: 800;
      color: #fff;
      text-shadow:
        0 0 30px rgba(139, 92, 246, 0.3),
        0 0 80px rgba(139, 92, 246, 0.15),
        0 0 150px rgba(201, 168, 76, 0.05);
      letter-spacing: -0.02em;
      line-height: 1.1;
      margin-bottom: 0.3rem;
      transform: translateZ(60px);
    }

    .hero-title .gradient-text {
      background: linear-gradient(
        135deg,
        #ffffff 0%,
        var(--gold-pale) 25%,
        var(--purple-soft) 50%,
        var(--purple-vivid) 75%,
        var(--gold-light) 100%
      );
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      background-size: 200% 200%;
      animation: shimmer 4s ease-in-out infinite alternate;
    }

    @keyframes shimmer {
      0% { background-position: 0% 50%; }
      100% { background-position: 100% 50%; }
    }

    .hero-sub {
      color: rgba(255, 255, 255, 0.4);
      font-size: 1.05rem;
      font-weight: 300;
      letter-spacing: 3px;
      margin-bottom: 0.5rem;
    }

    /* Countdown */
    .countdown {
      display: flex;
      justify-content: center;
      gap: 0.8rem;
      flex-wrap: wrap;
      transform: translateZ(45px);
    }

    .countdown-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      min-width: 80px;
    }

    .countdown-number {
      font-size: clamp(2.5rem, 6vw, 4rem);
      font-weight: 800;
      color: #fff;
      line-height: 1;
      text-shadow: 0 0 30px rgba(139, 92, 246, 0.25);
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.06);
      border-radius: 16px;
      padding: 0.6rem 1.2rem;
      min-width: 90px;
      text-align: center;
      transition: all 0.2s ease;
      position: relative;
      overflow: hidden;
    }

    .countdown-number::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(
        180deg,
        rgba(139, 92, 246, 0.06) 0%,
        transparent 40%,
        transparent 60%,
        rgba(201, 168, 76, 0.04) 100%
      );
      pointer-events: none;
    }

    .countdown-number.flip {
      animation: flipAnim 0.3s ease-out;
    }

    @keyframes flipAnim {
      0% { transform: rotateX(0deg) translateZ(0); }
      50% { transform: rotateX(-90deg) translateZ(-10px); opacity: 0.5; }
      100% { transform: rotateX(0deg) translateZ(0); }
    }

    .countdown-label {
      font-size: 0.65rem;
      text-transform: uppercase;
      letter-spacing: 3px;
      color: rgba(255, 255, 255, 0.3);
      margin-top: 0.6rem;
    }

    .countdown-sep {
      font-size: clamp(2rem, 5vw, 3.5rem);
      color: rgba(201, 168, 76, 0.12);
      font-weight: 100;
      align-self: center;
      padding-bottom: 1.2rem;
    }

    /* Notify button */
    .btn-notify {
      background: linear-gradient(
        135deg,
        rgba(139, 92, 246, 0.15),
        rgba(201, 168, 76, 0.1),
        rgba(124, 58, 237, 0.15)
      );
      border: 1px solid rgba(201, 168, 76, 0.2);
      color: #fff;
      padding: 0.85rem 3rem;
      border-radius: 50px;
      font-weight: 500;
      letter-spacing: 1.5px;
      font-size: 0.85rem;
      transition: all 0.5s ease;
      backdrop-filter: blur(8px);
      transform: translateZ(50px);
      position: relative;
      overflow: hidden;
    }

    .btn-notify::before {
      content: '';
      position: absolute;
      top: -50%;
      left: -50%;
      width: 200%;
      height: 200%;
      background: radial-gradient(
        circle at 30% 50%,
        rgba(201, 168, 76, 0.06) 0%,
        transparent 60%
      );
      opacity: 0;
      transition: opacity 0.5s ease;
    }

    .btn-notify:hover {
      background: linear-gradient(
        135deg,
        rgba(139, 92, 246, 0.3),
        rgba(201, 168, 76, 0.2),
        rgba(124, 58, 237, 0.3)
      );
      border-color: rgba(201, 168, 76, 0.4);
      box-shadow:
        0 0 40px rgba(139, 92, 246, 0.2),
        0 0 80px rgba(201, 168, 76, 0.1);
      color: #fff;
      transform: translateZ(50px) scale(1.05);
    }

    .btn-notify:hover::before {
      opacity: 1;
    }

    /* Social icons */
    .social-links {
      display: flex;
      justify-content: center;
      gap: 1.2rem;
      margin-top: 2rem;
      transform: translateZ(35px);
    }

    .social-link {
      color: rgba(255, 255, 255, 0.2);
      font-size: 1.3rem;
      transition: all 0.4s ease;
      text-decoration: none;
      width: 48px;
      height: 48px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      border: 1px solid rgba(255, 255, 255, 0.04);
      background: rgba(255, 255, 255, 0.01);
    }

    .social-link:hover {
      color: var(--gold-light);
      border-color: rgba(201, 168, 76, 0.25);
      background: rgba(201, 168, 76, 0.06);
      box-shadow: 0 0 40px rgba(201, 168, 76, 0.1);
      transform: translateY(-3px);
    }

    /* Animated background gradient */
    .bg-gradient {
      position: fixed;
      inset: 0;
      z-index: -1;
      background:
        radial-gradient(ellipse at 15% 40%, rgba(124, 58, 237, 0.12) 0%, transparent 60%),
        radial-gradient(ellipse at 85% 60%, rgba(201, 168, 76, 0.06) 0%, transparent 60%),
        radial-gradient(ellipse at 50% 0%, rgba(139, 92, 246, 0.08) 0%, transparent 50%),
        radial-gradient(ellipse at 50% 100%, rgba(61, 26, 46, 0.15) 0%, transparent 50%);
      animation: bgPulse 10s ease-in-out infinite alternate;
    }

    @keyframes bgPulse {
      0% { opacity: 0.6; transform: scale(1); }
      100% { opacity: 1; transform: scale(1.08); }
    }

    /* Fade-in animation on load */
    .fade-in-group {
      opacity: 0;
      animation: fadeUp 0.8s ease forwards;
    }

    .fade-in-group:nth-child(1) { animation-delay: 2.2s; }
    .fade-in-group:nth-child(2) { animation-delay: 2.5s; }
    .fade-in-group:nth-child(3) { animation-delay: 2.8s; }
    .fade-in-group:nth-child(4) { animation-delay: 3.1s; }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(30px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Subtle sparkle overlay */
    .sparkle {
      position: fixed;
      inset: 0;
      z-index: 3;
      pointer-events: none;
      background-image:
        radial-gradient(1px 1px at 10% 20%, rgba(201, 168, 76, 0.3) 0%, transparent 100%),
        radial-gradient(1px 1px at 30% 70%, rgba(201, 168, 76, 0.2) 0%, transparent 100%),
        radial-gradient(1.5px 1.5px at 60% 15%, rgba(201, 168, 76, 0.25) 0%, transparent 100%),
        radial-gradient(1px 1px at 80% 55%, rgba(201, 168, 76, 0.15) 0%, transparent 100%),
        radial-gradient(1px 1px at 45% 85%, rgba(201, 168, 76, 0.2) 0%, transparent 100%),
        radial-gradient(1.5px 1.5px at 90% 80%, rgba(201, 168, 76, 0.15) 0%, transparent 100%),
        radial-gradient(1px 1px at 5% 55%, rgba(139, 92, 246, 0.2) 0%, transparent 100%),
        radial-gradient(1px 1px at 70% 40%, rgba(139, 92, 246, 0.15) 0%, transparent 100%);
      animation: sparkleAnim 4s ease-in-out infinite alternate;
    }

    @keyframes sparkleAnim {
      0% { opacity: 0.3; }
      100% { opacity: 1; }
    }

    /* Responsive */
    @media (max-width: 768px) {
      .glass-card {
        padding: 2.5rem 1.5rem;
        border-radius: 24px;
        margin: 0 1rem;
      }

      .countdown-item {
        min-width: 60px;
      }

      .countdown-number {
        min-width: 60px;
        padding: 0.4rem 0.8rem;
        font-size: clamp(1.8rem, 8vw, 2.5rem);
        border-radius: 12px;
      }

      .countdown {
        gap: 0.4rem;
      }

      .countdown-sep {
        display: none;
      }

      .hero-card {
        transform: none !important;
      }

      .btn-notify {
        width: 100%;
      }

      .curtain-tie { display: none; }
    }

    @media (max-width: 480px) {
      .glass-card {
        padding: 2rem 1.2rem;
      }

      .countdown {
        gap: 0.3rem;
      }

      .countdown-item {
        min-width: 50px;
      }

      .countdown-number {
        min-width: 50px;
        padding: 0.3rem 0.5rem;
        font-size: 1.5rem;
      }

      .hero-title {
        font-size: 2rem;
      }

      .coming-label {
        font-size: 0.6rem;
        letter-spacing: 3px;
      }
    }
  </style>
</head>
<body>

  <!-- ── Curtains ── -->
  <div class="curtain-rod" id="curtainRod"></div>
  <div class="curtain-container" id="curtainContainer">
    <div class="curtain-panel curtain-panel--left" id="curtainLeft">
      <div class="curtain-drape"></div>
      <div class="curtain-fold"></div>
      <div class="curtain-fold"></div>
      <div class="curtain-fold"></div>
      <div class="curtain-fold"></div>
      <div class="curtain-fold"></div>
      <div class="curtain-fold"></div>
      <div class="curtain-tie"></div>
    </div>
    <div class="curtain-panel curtain-panel--right" id="curtainRight">
      <div class="curtain-drape"></div>
      <div class="curtain-fold"></div>
      <div class="curtain-fold"></div>
      <div class="curtain-fold"></div>
      <div class="curtain-fold"></div>
      <div class="curtain-fold"></div>
      <div class="curtain-fold"></div>
      <div class="curtain-tie"></div>
    </div>
  </div>
  <!-- ── End Curtains ── -->

  <!-- Background layers -->
  <div class="bg-gradient"></div>
  <canvas id="particles-canvas"></canvas>
  <div class="cinematic-overlay"></div>
  <div class="sparkle"></div>

  <!-- Main content -->
  <div class="container min-vh-100 d-flex align-items-center justify-content-center position-relative">
    <div class="hero-card" id="heroCard">
      <div class="glass-card text-center">

        <div class="fade-in-group">
          <div class="coming-label">Próximamente</div>
        </div>

        <div class="fade-in-group">
          <h1 class="hero-title">
            <span class="gradient-text">Algo Increíble</span><br>
            <span class="gradient-text">Está por Llegar</span>
          </h1>
          <p class="hero-sub">Prepárate para la experiencia</p>
        </div>

        <div class="ornament">
          <span class="ornament-line"></span>
          <span class="ornament-diamond"></span>
          <span class="ornament-line"></span>
        </div>

        <div class="fade-in-group">
          <div class="countdown" id="countdown">
            <div class="countdown-item">
              <div class="countdown-number" id="days">00</div>
              <span class="countdown-label">Días</span>
            </div>
            <span class="countdown-sep">:</span>
            <div class="countdown-item">
              <div class="countdown-number" id="hours">00</div>
              <span class="countdown-label">Horas</span>
            </div>
            <span class="countdown-sep">:</span>
            <div class="countdown-item">
              <div class="countdown-number" id="minutes">00</div>
              <span class="countdown-label">Minutos</span>
            </div>
            <span class="countdown-sep">:</span>
            <div class="countdown-item">
              <div class="countdown-number" id="seconds">00</div>
              <span class="countdown-label">Segundos</span>
            </div>
          </div>
        </div>

        <div class="ornament">
          <span class="ornament-line"></span>
          <span class="ornament-diamond"></span>
          <span class="ornament-line"></span>
        </div>

        <div class="fade-in-group">
          <button class="btn btn-notify" onclick="alert('¡Gracias por tu interés! Te notificaremos pronto.')">
            Notifícame
          </button>

          <div class="social-links">
            <a href="#" class="social-link" title="Instagram">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="2" width="20" height="20" rx="5" ry="5"/><path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"/><line x1="17.5" y1="6.5" x2="17.51" y2="6.5"/></svg>
            </a>
            <a href="#" class="social-link" title="Twitter / X">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4l11.733 16h4.267l-11.733 -16z"/><path d="M4 20l6.768 -6.768m2.46 -2.46L20 4"/></svg>
            </a>
            <a href="#" class="social-link" title="YouTube">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22.54 6.42a2.78 2.78 0 0 0 -1.94 -2C18.88 4 12 4 12 4s-6.88 0 -8.6 0.46a2.78 2.78 0 0 0 -1.94 2A29 29 0 0 0 1 12a29 29 0 0 0 0.46 5.58 2.78 2.78 0 0 0 1.94 2c1.72.46 8.6.46 8.6.46s6.88 0 8.6 -0.46a2.78 2.78 0 0 0 1.94 -2A29 29 0 0 0 23 12a29 29 0 0 0 -0.46 -5.58z"/><polygon points="9.75 15.02 15.5 12 9.75 8.98 9.75 15.02"/></svg>
            </a>
          </div>
        </div>

      </div>
    </div>
  </div>

  <script>
    // ─── Curtain open ─────────────────────────────────────────
    (function() {
      const left = document.getElementById('curtainLeft');
      const right = document.getElementById('curtainRight');

      window.addEventListener('load', () => {
        setTimeout(() => {
          left.classList.add('open-left');
          right.classList.add('open-right');
        }, 800);
      });
    })();

    // ─── Countdown ─────────────────────────────────────────────
    (function() {
      const target = new Date('2026-12-31T23:59:59');
      const els = {
        days: document.getElementById('days'),
        hours: document.getElementById('hours'),
        minutes: document.getElementById('minutes'),
        seconds: document.getElementById('seconds'),
      };

      function pad(n) { return String(n).padStart(2, '0'); }

      function tick() {
        const now = new Date();
        let diff = Math.max(0, target - now);
        const d = Math.floor(diff / 86400000); diff %= 86400000;
        const h = Math.floor(diff / 3600000);  diff %= 3600000;
        const m = Math.floor(diff / 60000);     diff %= 60000;
        const s = Math.floor(diff / 1000);

        const vals = { days: pad(d), hours: pad(h), minutes: pad(m), seconds: pad(s) };

        ['days', 'hours', 'minutes', 'seconds'].forEach(key => {
          if (els[key].textContent !== vals[key]) {
            els[key].textContent = vals[key];
            els[key].classList.remove('flip');
            void els[key].offsetWidth;
            els[key].classList.add('flip');
          }
        });
      }

      tick();
      setInterval(tick, 1000);
    })();

    // ─── Particles (Canvas) ────────────────────────────────────
    (function() {
      const canvas = document.getElementById('particles-canvas');
      const ctx = canvas.getContext('2d');
      let w, h;
      const particles = [];

      function resize() {
        w = canvas.width = window.innerWidth;
        h = canvas.height = window.innerHeight;
      }

      function init(count) {
        particles.length = 0;
        const colors = ['rgba(255,255,255', 'rgba(201,168,76', 'rgba(139,92,246'];
        for (let i = 0; i < count; i++) {
          particles.push({
            x: Math.random() * w,
            y: Math.random() * h,
            r: Math.random() * 2 + 0.3,
            dx: (Math.random() - 0.5) * 0.12,
            dy: (Math.random() - 0.5) * 0.12,
            alpha: Math.random() * 0.5 + 0.15,
            pulse: Math.random() * Math.PI * 2,
            color: colors[Math.floor(Math.random() * colors.length)],
          });
        }
      }

      function draw() {
        ctx.clearRect(0, 0, w, h);

        for (const p of particles) {
          p.x += p.dx;
          p.y += p.dy;
          p.pulse += 0.015;

          if (p.x < 0) p.x = w;
          if (p.x > w) p.x = 0;
          if (p.y < 0) p.y = h;
          if (p.y > h) p.y = 0;

          const pulseAlpha = p.alpha * (0.6 + 0.4 * Math.sin(p.pulse));
          ctx.beginPath();
          ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
          ctx.fillStyle = `${p.color}, ${pulseAlpha})`;
          ctx.fill();
        }

        requestAnimationFrame(draw);
      }

      resize();
      init(150);
      draw();
      window.addEventListener('resize', () => { resize(); init(150); });
    })();

    // ─── 3D Tilt ──────────────────────────────────────────────
    (function() {
      const card = document.getElementById('heroCard');
      let isMobile = window.innerWidth <= 768;

      const handleMove = (e) => {
        if (isMobile) return;
        const rect = card.getBoundingClientRect();
        const x = ((e.clientX - rect.left) / rect.width - 0.5) * 2;
        const y = ((e.clientY - rect.top) / rect.height - 0.5) * 2;
        const rotY = x * 8;
        const rotX = -y * 8;
        card.style.transform = `rotateX(${rotX}deg) rotateY(${rotY}deg)`;
      };

      const handleLeave = () => {
        if (isMobile) return;
        card.style.transform = 'rotateX(0deg) rotateY(0deg)';
      };

      document.addEventListener('mousemove', handleMove);
      card.addEventListener('mouseleave', handleLeave);

      window.addEventListener('resize', () => {
        isMobile = window.innerWidth <= 768;
        if (isMobile) card.style.transform = '';
      });
    })();
  </script>
</body>
